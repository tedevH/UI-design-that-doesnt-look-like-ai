[project]
name = "notai"
version = "0.1.0"
description = "Generate web UI that doesn't look AI-generated: a critic, a stylebook, and a fine-tunable local generator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
scrape = ["playwright>=1.45"]
critic = ["torch>=2.3", "transformers>=4.44", "pillow>=10", "numpy>=1.26", "scikit-learn>=1.5", "joblib>=1.4"]
generate = ["playwright>=1.45", "httpx>=0.27"]
api = ["anthropic>=0.40"]
finetune = ["mlx-lm>=0.19"]
all = ["notai[scrape,critic,generate,api,finetune]"]
dev = ["pytest>=8"]

[project.scripts]
notai = "notai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
