name: Knowledge catalogs

on:
  push:
    paths:
      - "skills/ui-design/data/**"
      - "skills/ui-design/scripts/knowledge.py"
      - "skills/ui-design/scripts/plan.py"
      - "skills/ui-design/scripts/validate_knowledge.py"
      - "skills/ui-design/tests/**"
      - ".github/workflows/knowledge.yml"
  pull_request:
    paths:
      - "skills/ui-design/data/**"
      - "skills/ui-design/scripts/knowledge.py"
      - "skills/ui-design/scripts/plan.py"
      - "skills/ui-design/scripts/validate_knowledge.py"
      - "skills/ui-design/tests/**"
      - ".github/workflows/knowledge.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate connected catalog
        run: python skills/ui-design/scripts/validate_knowledge.py
      - name: Run planner checks
        run: python -m unittest discover -s skills/ui-design/tests -v
