<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>notai — label</title>
<style>
  :root { --ink: #1b1a17; --paper: #f4f1ea; --rule: #d9d3c5; --muted: #77705f; --good: #2f6b3a; --bad: #9a3324; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.4 ui-monospace, "SF Mono", Menlo, monospace; }
  header { display: flex; gap: 24px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--paper); z-index: 2; }
  header b { font-weight: 600; letter-spacing: -0.01em; }
  header .keys { color: var(--muted); }
  header .keys kbd { border: 1px solid var(--rule); padding: 0 5px; margin-right: 2px; background: #fff; }
  header .right { margin-left: auto; color: var(--muted); }
  main { display: grid; gap: 1px; background: var(--rule); min-height: calc(100vh - 41px); }
  main.single { grid-template-columns: 1fr 300px; }
  main.pair { grid-template-columns: 1fr 1fr; }
  .pane { background: var(--paper); overflow: auto; max-height: calc(100vh - 41px); position: relative; }
  .pane img { display: block; width: 100%; }
  .tag { position: sticky; top: 0; padding: 6px 10px; background: var(--ink); color: var(--paper); font-size: 12px; display: flex; justify-content: space-between; }
  .flash { position: fixed; inset: auto 16px 16px auto; padding: 6px 12px; background: var(--ink); color: var(--paper); opacity: 0; transition: opacity .2s; }
  .flash.on { opacity: 1; }
  .empty { padding: 48px 16px; max-width: 60ch; }
  #prior { display: none; }
  body.show-prior #prior { display: inline; }
</style>
</head>
<body>
<header>
  <b>notai label</b>
  <span class="keys" id="keys"></span>
  <span class="right"><span id="prior"></span> <span id="progress"></span> · <a href="#" id="toggle">switch mode</a></span>
</header>
<main id="main"></main>
<div class="flash" id="flash"></div>
<script>
let mode = new URLSearchParams(location.search).get("mode") || "__MODE__";
let current = null;
const $ = (id) => document.getElementById(id);

function flash(text, color) {
  const f = $("flash"); f.textContent = text; f.style.background = color || "var(--ink)";
  f.classList.add("on"); setTimeout(() => f.classList.remove("on"), 500);
}

async function next() {
  const r = await fetch(`/api/next?mode=${mode}`).then((r) => r.json());
  current = r;
  const main = $("main");
  main.className = mode;
  if (r.empty) { main.innerHTML = `<div class="pane empty">${r.message}</div>`; return; }
  if (mode === "single") {
    $("keys").innerHTML = "<kbd>G</kbd>good <kbd>V</kbd>vibecoded <kbd>S</kbd>skip <kbd>U</kbd>undo <kbd>P</kbd>show prior";
    $("progress").textContent = `${r.progress}/${r.total} labeled`;
    $("prior").textContent = `prior: ${r.site.source} ·`;
    const s = r.site;
    main.innerHTML = `
      <div class="pane"><div class="tag"><span>${s.url}</span><span>desktop</span></div><img src="/img/${s.slug}/desktop.png"></div>
      <div class="pane"><div class="tag"><span>mobile</span></div>${s.has_mobile ? `<img src="/img/${s.slug}/mobile.png">` : ""}</div>`;
  } else {
    $("keys").innerHTML = "<kbd>1</kbd>left better <kbd>2</kbd>right better <kbd>=</kbd>tie <kbd>Space</kbd>skip";
    $("progress").textContent = `${r.progress} pairs judged`;
    $("prior").textContent = "";
    main.innerHTML = [r.a, r.b].map((s, i) =>
      `<div class="pane"><div class="tag"><span>${i + 1}</span><span>${s.url}</span></div><img src="/img/${s.slug}/desktop.png"></div>`).join("");
  }
}

async function post(row) {
  await fetch("/api/label", { method: "POST", body: JSON.stringify(row) });
}

let last = null;
document.addEventListener("keydown", async (e) => {
  if (!current || current.empty) return;
  const k = e.key.toLowerCase();
  if (mode === "single") {
    const slug = current.site.slug;
    const map = { g: "good", v: "vibe", s: "skip" };
    if (map[k]) { await post({ kind: "single", slug, label: map[k] }); last = slug; flash(map[k], k === "g" ? "var(--good)" : k === "v" ? "var(--bad)" : null); next(); }
    else if (k === "u" && last) { await post({ kind: "undo", slug: last }); flash("undone"); last = null; }
    else if (k === "p") document.body.classList.toggle("show-prior");
  } else {
    const map = { "1": "a", "2": "b", "=": "tie" };
    if (map[k]) { await post({ kind: "pair", a: current.a.slug, b: current.b.slug, winner: map[k] }); flash(map[k]); next(); }
    else if (k === " ") { e.preventDefault(); next(); }
  }
});
$("toggle").onclick = (e) => { e.preventDefault(); mode = mode === "single" ? "pair" : "single"; next(); };
next();
</script>
</body>
</html>
